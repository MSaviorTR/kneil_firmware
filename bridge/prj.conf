# KNEIL BLE bridge on the Seeed XIAO nRF52840 (board target xiao_ble).
# The board already sets up the USB CDC ACM serial port and the UF2 output (zephyr.uf2).

# Bluetooth LE central
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="KNEIL bridge"
CONFIG_BT_RX_STACK_SIZE=2048

# ATT MTU 247 and data length extension (251-byte link-layer packets)
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# USB serial carries only the protocol lines: no console, no logs, no boot banner
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_RING_BUFFER=y
CONFIG_USB_DEVICE_PRODUCT="KNEIL bridge"
CONFIG_USB_DEVICE_MANUFACTURER="KNEIL"

CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
