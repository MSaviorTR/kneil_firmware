# Console and Debug (for development - disable for production)
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_RTT_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_DEBUG=n

# I2C Configuration
CONFIG_I2C=y

# 32kHz clock source: this module has no external 32.768kHz crystal fitted
# (see datasheet section 12, "Notes"), so the SoftDevice Controller/MPSL must
# be told to use the internal RC oscillator instead of an XTAL. Without this,
# the build fails in mpsl_init.c with "Clock source is not supported or not
# defined".
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Bluetooth Configuration
# NOTE: CONFIG_BT_LL_SOFTDEVICE is selected by default on nRF54L, unlike the
# nRF52832 build this project was ported from (which used the Zephyr
# BT_LL_SW_SPLIT controller). TX power is therefore set with
# BT_CTLR_TX_PWR_ANTENNA (dBm) instead of the BT_CTLR_TX_PWR_PLUS_x choice.
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="NeiL V3"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_DYNAMIC_DB=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_DATA_LEN_UPDATE=n
CONFIG_BT_SETTINGS=n
CONFIG_SETTINGS=n

# Power: without a preferred connection interval, most centrals (esp. iOS)
# default to a fast ~30-50ms interval, keeping the radio active far more
# often than this app needs (send_data_thread only has new data every
# NOTIFY_INTERVAL=100ms). CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS defaults to y
# and was previously being force-disabled here, which meant these preferred
# values were also never requested to the central.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=80
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=160
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Reduce CPU frequency when idle
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100

# Disable features not needed
CONFIG_TIMESLICING=n

# Sensor Support
CONFIG_SENSOR=y

# GPIO Configuration
CONFIG_GPIO=n

# Standard C Library
CONFIG_NEWLIB_LIBC=y

# Power Management
# NOTE: CONFIG_PM/CONFIG_PM_DEVICE are left out here: the nRF54L SoC family
# does not select HAS_PM in this NCS version (only nRF54H does), so setting
# them is a silently-dropped no-op that just produces a Kconfig warning.
CONFIG_HWINFO=y
CONFIG_POWEROFF=y

# Bluetooth Device Information Service
# NOTE: CONFIG_BT_DIS_MANUF/CONFIG_BT_DIS_MODEL are deprecated in this Zephyr
# version; use the *_NAME_STR / *_NUMBER_STR equivalents instead.
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME_STR="NEIL TECH LTD"
CONFIG_BT_DIS_MODEL_NUMBER_STR="NeiL V01"

# Memory optimization
CONFIG_MAIN_STACK_SIZE=2048

# ===== POWER OPTIMIZATION SETTINGS =====
# Request +4 dBm TX power (SoftDevice Controller antenna power, in dBm)
CONFIG_BT_CTLR_TX_PWR_ANTENNA=4
