# KNEIL live build for the es4l15ba1 board: activity classifier (kneil_tinyml, model V3).
# Use it on top of prj.conf, in its own build folder (the NeiL app in main.c is not changed):
#   west build -d build_kneil -b es4l15ba1/nrf54l15/cpuapp . -- -DBOARD_ROOT=. -DEXTRA_CONF_FILE=kneil.conf

# Build src/kneil_live.c instead of src/main.c
CONFIG_NEIL_APP_KNEIL_LIVE=y

# kneil_tinyml library
CONFIG_KNEIL_TINYML=y
CONFIG_KNEIL_TINYML_FS_HZ=50
CONFIG_KNEIL_TINYML_SELFTEST=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Bluetooth LE: advertises KNEIL-xxxx with the KNEIL live service (LIVE, RAW, CONTROL).
# ATT MTU 247 and data length extension (prj.conf turns these updates off for the NeiL app).
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y
# margin for the Bluetooth RX thread (GATT callbacks run on it; 1024 overflowed once)
CONFIG_BT_RX_STACK_SIZE=2048

# A fault restarts the board instead of halting it (the bridge reconnects by itself); the fault report
# is printed on RTT and the INFO summary shows the reset cause.
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=2

# Diagnostics only over SEGGER RTT (this board has no UART or USB; tests use BLE and the bridge)
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
