# Debug overlay: re-enables the RTT console/printk/logging that prj.conf
# turns off for the power-optimized production build. Build with this on top
# of prj.conf, e.g.:
#   west build -b es4l15ba1/nrf54l15/cpuapp -- -DEXTRA_CONF_FILE=debug.conf
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_DEBUG=y

# Needed for the RTC INT-pin GPIO monitoring diagnostic (main.c int_gpio).
CONFIG_GPIO=y

# The default 1 kB RTT up-buffer overflows during the dense boot-time sensor
# probe (the host logger only drains ~2 kB/s), silently dropping lines.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
